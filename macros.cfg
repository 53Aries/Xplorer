#####################################################################
# macros.cfg — General printer macros
# IDEX-specific: fan routing, tool changes, print start/end,
# copy & mirror modes, nozzle brushing.
#####################################################################

#####################################################################
# Mainsail Client Variables
#
# Loaded by mainsail.cfg. Sets retract/Z-hop/speed defaults.
# PAUSE/RESUME/CANCEL_PRINT below override Mainsail's defaults
# with IDEX-aware versions that park each toolhead at its own
# endstop (T0→X-10, T1→X410) and bring Y to the front.
#
# Klipper merges same-named sections — the later one's options win —
# so these REPLACE Mainsail's macros rather than wrapping them.
# mainsail.cfg must be included BEFORE macros.cfg so ours take effect.
# The rename_existing values below (not Mainsail's) name the natives:
#   BASE_PAUSE        = Klipper native pause
#   BASE_RESUME       = Klipper native resume
#   BASE_CANCEL_PRINT = Klipper native cancel
#####################################################################

[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos:   False       # IDEX PAUSE macro handles positioning directly
variable_custom_park_x:    0.0
variable_custom_park_y:    10.0
variable_custom_park_dz:   10.0
variable_retract:          1.0         # mm to retract on pause
variable_cancel_retract:   3.0         # mm to retract on cancel
variable_speed_retract:    35.0        # mm/s
variable_unretract:        1.0         # mm to unretract on resume
variable_speed_unretract:  35.0
variable_speed_hop:        15.0        # mm/s for Z hop
variable_speed_move:       150.0       # mm/s for park moves
variable_park_at_cancel:   True
variable_park_at_cancel_x: 0.0
variable_park_at_cancel_y: 10.0
variable_use_fw_retract:   False
variable_idle_timeout:     0
gcode:

#####################################################################
# PAUSE — park active IDEX toolhead at its X endstop
#####################################################################

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
description: Pause print and park active toolhead at its endstop
variable_resume_cm_mode: 0   # copy/mirror mode in effect at pause time, for RESUME to restore
variable_resume_t0:      0   # heater targets at pause time — RESUME restores and waits
variable_resume_t1:      0
variable_resume_bed:     0
variable_resume_chamber: 0
gcode:
  {% set toolchange = printer['gcode_macro _TOOLCHANGE_VARS'] %}
  {% set copy_mirror = printer['gcode_macro _COPY_MIRROR_VARS'] %}
  {% set max_z = printer.toolhead.axis_maximum.z %}
  {% set cur_z = printer.toolhead.position.z %}
  {% set new_z = [cur_z + 10.0, max_z]|min %}
  SAVE_GCODE_STATE NAME=PAUSE_STATE
  BASE_PAUSE                           # Klipper native pause — stops job queue
  SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=resume_cm_mode VALUE={copy_mirror.mode}
  SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=resume_t0 VALUE={printer.extruder.target}
  SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=resume_t1 VALUE={printer.extruder1.target}
  SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=resume_bed VALUE={printer.heater_bed.target}
  SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=resume_chamber VALUE={printer['heater_generic chamber_heater'].target}
  {% if printer[printer.toolhead.extruder].can_extrude %}
    G91
    G1 E-1.0 F{35 * 60}              # retract 1 mm
  {% endif %}
  G90
  G1 Z{new_z} F{20 * 60}             # Z hop
  {% if copy_mirror.mode != 0 %}
    # Copy/mirror mode — deactivate sync and park both carriages
    DEACTIVATE_COPY_MIRROR_MODE
    SET_DUAL_CARRIAGE CARRIAGE=1
    G1 X{toolchange.t1_park_x} F{toolchange.park_speed * 60}   # T1 → right endstop
    SET_DUAL_CARRIAGE CARRIAGE=0
    G1 X{toolchange.t0_park_x} F{toolchange.park_speed * 60}   # T0 → left endstop
  {% elif printer.toolhead.extruder == "extruder" %}
    G1 X{toolchange.t0_park_x} F{toolchange.park_speed * 60}   # T0 → left endstop
  {% else %}
    G1 X{toolchange.t1_park_x} F{toolchange.park_speed * 60}   # T1 → right endstop
  {% endif %}
  G1 Y10 F{100 * 60}                 # Y to front for filament access

#####################################################################
# RESUME — unretract and return to print position
#####################################################################

[gcode_macro RESUME]
rename_existing: BASE_RESUME
description: Restore heaters and wait, then unretract and resume print from saved position
gcode:
  {% set pause    = printer['gcode_macro PAUSE'] %}
  {% set dual = pause.resume_cm_mode | int != 0 %}
  {% set tool = printer.toolhead.extruder %}
  {% if printer.toolhead.homed_axes != "xyz" %}
    # Steppers were disabled during the pause — position is lost and Z can't be
    # re-homed over the part (touch is at bed centre). Cancel instead.
    { action_raise_error("RESUME: axes no longer homed (" ~ printer.toolhead.homed_axes ~ ") — print position lost, cancel the print") }
  {% endif %}
  # Restore every heater target from pause time (idle_timeout or the user may
  # have changed them), then wait for the ones the print needs right away.
  # The idle tool only gets its target back — it reaches print temp
  # on its next tool change. Chamber is not waited on (slow thermal mass).
  SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={pause.resume_bed}
  SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={pause.resume_chamber}
  SET_HEATER_TEMPERATURE HEATER=extruder TARGET={pause.resume_t0}
  SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET={pause.resume_t1}
  {% if pause.resume_bed > 0 %}
    RESPOND TYPE=echo MSG="RESUME: waiting for bed {pause.resume_bed}°C"
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={pause.resume_bed - 2}
  {% endif %}
  {% if pause.resume_t0 > 0 and (dual or tool == "extruder") %}
    RESPOND TYPE=echo MSG="RESUME: waiting for T0 {pause.resume_t0}°C"
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={pause.resume_t0 - 2}
  {% endif %}
  {% if pause.resume_t1 > 0 and (dual or tool == "extruder1") %}
    RESPOND TYPE=echo MSG="RESUME: waiting for T1 {pause.resume_t1}°C"
    TEMPERATURE_WAIT SENSOR=extruder1 MINIMUM={pause.resume_t1 - 2}
  {% endif %}
  _RESUME_FINISH

[gcode_macro _RESUME_FINISH]
description: Second half of RESUME — rendered after the heat-up so can_extrude is current
gcode:
  {% set resume_cm_mode = printer['gcode_macro PAUSE'].resume_cm_mode | int %}
  {% if resume_cm_mode == 1 %}
    ACTIVATE_COPY_MODE                 # re-engage copy sync before restoring position
  {% elif resume_cm_mode == 2 %}
    ACTIVATE_MIRROR_MODE               # re-engage mirror sync before restoring position
  {% endif %}
  {% if printer[printer.toolhead.extruder].can_extrude %}
    G91
    G1 E1.0 F{35 * 60}               # unretract 1 mm
    G90
  {% endif %}
  RESTORE_GCODE_STATE NAME=PAUSE_STATE MOVE=1 MOVE_SPEED=100
  BASE_RESUME                          # Klipper native resume

#####################################################################
# CANCEL_PRINT — park active toolhead, heaters off, disable steppers
#####################################################################

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
description: Cancel print, park active toolhead, disable heaters and steppers
gcode:
  {% set toolchange = printer['gcode_macro _TOOLCHANGE_VARS'] %}
  {% set copy_mirror = printer['gcode_macro _COPY_MIRROR_VARS'] %}
  {% set max_z = printer.toolhead.axis_maximum.z %}
  {% set cur_z = printer.toolhead.position.z %}
  {% set new_z = [cur_z + 20.0, max_z]|min %}
  TURN_OFF_HEATERS
  M107                               # part cooling off
  {% if printer.extruder.can_extrude %}
    G91
    G1 E-3.0 F{35 * 60}              # retract 3 mm
  {% endif %}
  G90
  G1 Z{new_z} F{20 * 60}             # Z lift
  {% if copy_mirror.mode != 0 %}
    # Copy/mirror mode — deactivate sync and park both carriages
    DEACTIVATE_COPY_MIRROR_MODE
    SET_DUAL_CARRIAGE CARRIAGE=1
    G1 X{toolchange.t1_park_x} F{toolchange.park_speed * 60}   # T1 → right endstop
    SET_DUAL_CARRIAGE CARRIAGE=0
    G1 X{toolchange.t0_park_x} F{toolchange.park_speed * 60}   # T0 → left endstop
  {% elif printer.toolhead.extruder == "extruder" %}
    G1 X{toolchange.t0_park_x} F{toolchange.park_speed * 60}   # T0 → left endstop
  {% else %}
    G1 X{toolchange.t1_park_x} F{toolchange.park_speed * 60}   # T1 → right endstop
  {% endif %}
  G1 Y10 F{100 * 60}
  BASE_CANCEL_PRINT                    # Klipper native cancel
  M84                                # disable steppers
  NEVERMORE_VENT_OPEN                  # open vent to exhaust
  _RESET_PRINT_MODE

#####################################################################
# Nozzle Brush
#
# Two silicone/wire brushes mounted at the rear of the print bed.
# T0 brush: X83–118, Y≈403  (rear-left,  matches FORMBOT Xplorer)
# T1 brush: X283–318, Y≈403  (rear-right, matches FORMBOT Xplorer)
#
# brush_z: Z height (machine coords) where nozzle skims bristles.
#   After first CARTOGRAPHER_TOUCH, jog nozzle until it just touches
#   the bristles and record that Z value here.
#   Typical starting value: 2.0 – 3.0 mm.
#####################################################################

[gcode_macro BRUSH_VARS]
variable_t0_brush_x_start:  83     # T0 brush left X edge
variable_t0_brush_y:       403     # T0 brush centre Y
variable_t1_brush_x_start: 283     # T1 brush left X edge
variable_t1_brush_y:       403     # T1 brush centre Y
variable_brush_width:       35     # Brush span in X (mm) — X+35 = right edge
variable_brush_depth:        6     # Y swept ±(depth/2) around centre
variable_brush_z:            2.0   # Z during wiping (machine coords) — TUNE THIS
variable_approach_speed:   150     # mm/s — speed to approach brush
variable_wipe_speed:       250     # mm/s — speed during wipe passes
variable_wipe_count:          4    # Back-and-forth wipe cycles
variable_brush_temp_offset:  20    # brush at slicer print temp minus this (°C)
variable_brush_temp_window:   5    # brush once nozzle is within ± this of brush temp
variable_brush_default_temp: 180   # fallback print temp when no print has run yet
variable_brush_min_temp:     150   # never brush below this, whatever the print temp
variable_brush_idle_cool_temp: 100 # if the heater was off before brushing, fan-cool to this (°C) after
gcode:  # variable holder

[gcode_macro BRUSH_T0]
description: Bring T0 to brush temp (print temp - offset), wipe nozzle, restore heater target
gcode:
  {% set brush         = printer['gcode_macro BRUSH_VARS'] %}
  {% set saved        = printer.save_variables.variables %}
  {% set x0         = brush.t0_brush_x_start | float %}
  {% set x1         = x0 + brush.brush_width %}
  {% set y_ctr      = brush.t0_brush_y | float %}
  {% set y_hi       = y_ctr + brush.brush_depth / 2 %}
  {% set y_lo       = y_ctr - brush.brush_depth / 2 %}
  # Brush temp: slicer print temp (saved by PRINT_START) minus offset, floored at brush_min_temp
  {% set last_temp  = saved.t0_last_print_temp | default(brush.brush_default_temp) | float %}
  {% set brush_temp = [last_temp - brush.brush_temp_offset, brush.brush_min_temp] | max | int %}
  {% set prev_target = printer.extruder.target | float %}
  {% set prev_fan    = printer['fan_generic fan_t0'].speed | float %}
  # Restoring the previous target means cooling when it is below the brush temp.
  # COOL_WAIT=0 skips the wait (TOUCH_BRUSH keeps wiping while the nozzle cools instead)
  {% set needs_cool  = prev_target < brush_temp - brush.brush_temp_window and (params.COOL_WAIT | default(1) | int) != 0 %}
  {% set cool_to     = (prev_target if prev_target > 0 else brush.brush_idle_cool_temp) | float %}
  SAVE_GCODE_STATE NAME=brush_t0_state
  # Ensure T0 is active
  SET_DUAL_CARRIAGE CARRIAGE=0
  ACTIVATE_EXTRUDER EXTRUDER=extruder
  # Heat or cool to brush temp — always wait, so a still-heating nozzle is never brushed
  RESPOND TYPE=echo MSG="BRUSH_T0: bringing nozzle to {brush_temp}°C before wipe"
  SET_HEATER_TEMPERATURE HEATER=extruder TARGET={brush_temp}
  TEMPERATURE_WAIT SENSOR=extruder MINIMUM={brush_temp - brush.brush_temp_window} MAXIMUM={brush_temp + brush.brush_temp_window}
  G90
  # Lift to safe Z, then approach brush
  G1 Z10 F{20 * 60}
  G1 X{x0} Y{y_ctr} F{brush.approach_speed * 60}
  # Descend to bristle contact height
  G1 Z{brush.brush_z} F{20 * 60}
  # Phase 1 — diagonal weave passes
  {% for i in range(brush.wipe_count) %}
    {% if i % 2 == 0 %}
      G1 X{x1} Y{y_hi} F{brush.wipe_speed * 60}
      G1 X{x0} Y{y_lo} F{brush.wipe_speed * 60}
    {% else %}
      G1 X{x1} Y{y_lo} F{brush.wipe_speed * 60}
      G1 X{x0} Y{y_hi} F{brush.wipe_speed * 60}
    {% endif %}
  {% endfor %}
  # Phase 2 — two clockwise circles centred in the brush
  {% set x_ctr = x0 + brush.brush_width / 2 %}
  {% set radius = brush.brush_depth / 2 %}
  G1 X{x_ctr - radius} Y{y_ctr} F{brush.approach_speed * 60}
  G2 I{radius} J0 F{brush.wipe_speed * 60}
  G2 I{radius} J0 F{brush.wipe_speed * 60}
  # Phase 3 — final diagonal sweep to clear nozzle tip
  G1 X{x0} Y{y_lo} F{brush.wipe_speed * 60}
  G1 X{x1} Y{y_hi} F{brush.wipe_speed * 60}
  G1 X{x0} Y{y_ctr} F{brush.wipe_speed * 60}
  # Lift clear of brush
  G1 Z10 F{20 * 60}
  # Restore heater to its previous target (e.g. 0 if printer was cold, touch temp in PRINT_START)
  SET_HEATER_TEMPERATURE HEATER=extruder TARGET={prev_target | int}
  {% if needs_cool %}
    # Part fan on while the nozzle drops to the restored target (or brush_idle_cool_temp if it was off)
    RESPOND TYPE=echo MSG="BRUSH_T0: cooling nozzle to {cool_to | int}°C"
    SET_FAN_SPEED FAN=fan_t0 SPEED=1.0
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={cool_to + 2}
    SET_FAN_SPEED FAN=fan_t0 SPEED={prev_fan}
  {% endif %}
  RESTORE_GCODE_STATE NAME=brush_t0_state MOVE=0
  G90

#####################################################################
# TOUCH_BRUSH — T0 wipe before a Cartographer touch
#
# 1. Hot wipe (BRUSH_T0) to pull filament off the tip.
# 2. Drop the heater to touch_temp with the part fan on and wipe once per
#    wipe_every °C of cooling — ooze from the cool-down is brushed away
#    instead of hanging on the tip for the touch.
# 3. One last wipe once the nozzle is at touch temp.
# Leaves T0 at touch_temp, parked over the brush at Z10.
#
# Why not a delayed_gcode / recursion: a delayed_gcode cannot run while a
# macro holds the gcode lock (PRINT_START is one long macro), and Klipper
# forbids a macro calling itself. So this queues the step macro a fixed
# number of times in a row. Each call renders when it RUNS (after the
# previous step's M400), reads the live nozzle temperature, and becomes a
# no-op once the nozzle is at touch temp.
#####################################################################

[gcode_macro TOUCH_BRUSH]
description: Hot-wipe T0, then wipe once per wipe_every °C while it cools to touch temp
variable_wipe_every:    10    # °C of cooling between wipe passes
variable_max_steps:    240    # most polling steps to queue (each idles 0.5 s unless it wipes)
variable_last_wipe_temp: 0    # nozzle temp at the last wipe — do not edit
gcode:
  {% set touch     = printer["gcode_macro CARTOGRAPHER_TOUCH_HOME"].touch_temp | float %}
  {% set prev_fan  = printer['fan_generic fan_t0'].speed | float %}
  {% set max_steps = printer['gcode_macro TOUCH_BRUSH'].max_steps | int %}
  BRUSH_T0 COOL_WAIT=0                   # hot wipe; leaves the heater at its previous target
  SET_HEATER_TEMPERATURE HEATER=extruder TARGET={touch | int}
  RESPOND TYPE=echo MSG="TOUCH_BRUSH: cooling to {touch | int}°C, wiping every {printer['gcode_macro TOUCH_BRUSH'].wipe_every}°C"
  SET_FAN_SPEED FAN=fan_t0 SPEED=1.0
  SET_GCODE_VARIABLE MACRO=TOUCH_BRUSH VARIABLE=last_wipe_temp VALUE=0
  {% for i in range(max_steps) %}
    _TOUCH_BRUSH_STEP
  {% endfor %}
  # Backstop — only waits if the steps ran out before the nozzle was cool
  TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={touch + 2}
  _TOUCH_BRUSH_WIPE                      # final wipe at touch temp
  SET_FAN_SPEED FAN=fan_t0 SPEED={prev_fan}
  G1 Z10 F{20 * 60}

# One polling step while T0 is above touch temp: the first records the
# starting temperature (the hot wipe just happened), later ones wipe when the
# nozzle has cooled wipe_every °C since the last wipe, otherwise idle 0.5 s.
[gcode_macro _TOUCH_BRUSH_STEP]
gcode:
  {% set touch_brush = printer['gcode_macro TOUCH_BRUSH'] %}
  {% set touch       = printer["gcode_macro CARTOGRAPHER_TOUCH_HOME"].touch_temp | float %}
  {% set temp        = printer.extruder.temperature | float %}
  {% if temp > touch + 2 %}
    {% if touch_brush.last_wipe_temp == 0 %}
      SET_GCODE_VARIABLE MACRO=TOUCH_BRUSH VARIABLE=last_wipe_temp VALUE={temp}
    {% endif %}
    {% if touch_brush.last_wipe_temp > 0 and touch_brush.last_wipe_temp - temp >= touch_brush.wipe_every %}
      _TOUCH_BRUSH_WIPE
      SET_GCODE_VARIABLE MACRO=TOUCH_BRUSH VARIABLE=last_wipe_temp VALUE={temp}
    {% else %}
      G4 P500
      M400
    {% endif %}
  {% endif %}

# One wipe pass over the T0 brush (wipe_count back-and-forth diagonal cycles).
[gcode_macro _TOUCH_BRUSH_WIPE]
gcode:
  {% set brush = printer['gcode_macro BRUSH_VARS'] %}
  {% set x0    = brush.t0_brush_x_start | float %}
  {% set x1    = x0 + brush.brush_width %}
  {% set y_ctr = brush.t0_brush_y | float %}
  {% set y_hi  = y_ctr + brush.brush_depth / 2 %}
  {% set y_lo  = y_ctr - brush.brush_depth / 2 %}
  G90
  G1 X{x0} Y{y_ctr} F{brush.approach_speed * 60}
  G1 Z{brush.brush_z} F{20 * 60}
  {% for i in range(brush.wipe_count) %}
    {% if i % 2 == 0 %}
      G1 X{x1} Y{y_hi} F{brush.wipe_speed * 60}
      G1 X{x0} Y{y_lo} F{brush.wipe_speed * 60}
    {% else %}
      G1 X{x1} Y{y_lo} F{brush.wipe_speed * 60}
      G1 X{x0} Y{y_hi} F{brush.wipe_speed * 60}
    {% endif %}
  {% endfor %}
  M400

[gcode_macro BRUSH_T1]
description: Bring T1 to brush temp (print temp - offset), wipe nozzle, restore heater target
gcode:
  {% set brush          = printer['gcode_macro BRUSH_VARS'] %}
  {% set saved         = printer.save_variables.variables %}
  {% set x0          = brush.t1_brush_x_start | float %}
  {% set x1          = x0 + brush.brush_width %}
  {% set y_ctr       = brush.t1_brush_y | float %}
  {% set y_hi        = y_ctr + brush.brush_depth / 2 %}
  {% set y_lo        = y_ctr - brush.brush_depth / 2 %}
  # Brush temp: slicer print temp (saved by PRINT_START) minus offset, floored at brush_min_temp
  {% set last_temp   = saved.t1_last_print_temp | default(brush.brush_default_temp) | float %}
  {% set brush_temp  = [last_temp - brush.brush_temp_offset, brush.brush_min_temp] | max | int %}
  {% set prev_target = printer.extruder1.target | float %}
  {% set prev_fan    = printer['fan_generic fan_t1'].speed | float %}
  # Restoring the previous target means cooling when it is below the brush temp
  {% set needs_cool  = prev_target < brush_temp - brush.brush_temp_window %}
  {% set cool_to     = (prev_target if prev_target > 0 else brush.brush_idle_cool_temp) | float %}
  SAVE_GCODE_STATE NAME=brush_t1_state
  # Activate T1
  SET_DUAL_CARRIAGE CARRIAGE=1
  ACTIVATE_EXTRUDER EXTRUDER=extruder1
  # Heat or cool to brush temp — always wait, so a still-heating nozzle is never brushed
  RESPOND TYPE=echo MSG="BRUSH_T1: bringing nozzle to {brush_temp}°C before wipe"
  SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET={brush_temp}
  TEMPERATURE_WAIT SENSOR=extruder1 MINIMUM={brush_temp - brush.brush_temp_window} MAXIMUM={brush_temp + brush.brush_temp_window}
  G90
  G1 Z10 F{20 * 60}
  G1 X{x1} Y{y_ctr} F{brush.approach_speed * 60}   # approach from right for T1
  G1 Z{brush.brush_z} F{20 * 60}
  # Phase 1 — diagonal weave passes
  {% for i in range(brush.wipe_count) %}
    {% if i % 2 == 0 %}
      G1 X{x0} Y{y_hi} F{brush.wipe_speed * 60}
      G1 X{x1} Y{y_lo} F{brush.wipe_speed * 60}
    {% else %}
      G1 X{x0} Y{y_lo} F{brush.wipe_speed * 60}
      G1 X{x1} Y{y_hi} F{brush.wipe_speed * 60}
    {% endif %}
  {% endfor %}
  # Phase 2 — two clockwise circles centred in the brush
  {% set x_ctr = x0 + brush.brush_width / 2 %}
  {% set radius = brush.brush_depth / 2 %}
  G1 X{x_ctr - radius} Y{y_ctr} F{brush.approach_speed * 60}
  G2 I{radius} J0 F{brush.wipe_speed * 60}
  G2 I{radius} J0 F{brush.wipe_speed * 60}
  # Phase 3 — final diagonal sweep to clear nozzle tip
  G1 X{x1} Y{y_lo} F{brush.wipe_speed * 60}
  G1 X{x0} Y{y_hi} F{brush.wipe_speed * 60}
  G1 X{x1} Y{y_ctr} F{brush.wipe_speed * 60}
  G1 Z10 F{20 * 60}
  # Restore heater to its previous target
  SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET={prev_target | int}
  {% if needs_cool %}
    # Part fan on while the nozzle drops to the restored target (or brush_idle_cool_temp if it was off)
    RESPOND TYPE=echo MSG="BRUSH_T1: cooling nozzle to {cool_to | int}°C"
    SET_FAN_SPEED FAN=fan_t1 SPEED=1.0
    TEMPERATURE_WAIT SENSOR=extruder1 MAXIMUM={cool_to + 2}
    SET_FAN_SPEED FAN=fan_t1 SPEED={prev_fan}
  {% endif %}
  RESTORE_GCODE_STATE NAME=brush_t1_state MOVE=0
  G90

#####################################################################
# M106 / M107 Fan Routing
# Routes slicer fan commands to the active toolhead's part cooling fan
#####################################################################

[gcode_macro M106]
description: Set part cooling fan speed for active toolhead (both in copy/mirror mode)
gcode:
  {% set speed = (params.S | default(255)) | int %}
  {% set pct = (speed / 255.0) %}
  {% set dual = printer["gcode_macro _COPY_MIRROR_VARS"].mode != 0 %}
  {% if dual or printer.toolhead.extruder == "extruder" %}
    SET_FAN_SPEED FAN=fan_t0 SPEED={pct}
  {% endif %}
  {% if dual or printer.toolhead.extruder != "extruder" %}
    SET_FAN_SPEED FAN=fan_t1 SPEED={pct}
  {% endif %}

[gcode_macro M107]
description: Turn off part cooling fan for active toolhead (both in copy/mirror mode)
gcode:
  {% set dual = printer["gcode_macro _COPY_MIRROR_VARS"].mode != 0 %}
  {% if dual or printer.toolhead.extruder == "extruder" %}
    SET_FAN_SPEED FAN=fan_t0 SPEED=0
  {% endif %}
  {% if dual or printer.toolhead.extruder != "extruder" %}
    SET_FAN_SPEED FAN=fan_t1 SPEED=0
  {% endif %}

#####################################################################
# Tool Change Macros
#####################################################################

# Park positions — each tool parks at its own X endstop. The two park_x values
# below are overwritten at every Klipper start from x_axis.cfg
# ([stepper_x] / [dual_carriage] position_endstop), see _TOOLCHANGE_INIT; the
# literals here are only a fallback until that runs.
[gcode_macro _TOOLCHANGE_VARS]
variable_t0_park_x:     -10    # T0 parks at its left endstop  ([stepper_x] position_endstop)
variable_t1_park_x:     410    # T1 parks at its right endstop ([dual_carriage] position_endstop)
variable_park_speed:      300   # mm/s travel speed for park move
variable_z_drop_mm:       5.0   # mm to drop Z before park move
variable_t0_print_temp:     0   # set by PRINT_START from slicer param
variable_t1_print_temp:     0   # set by PRINT_START from slicer param
gcode:  # variable holder

# Copy the X endstop positions from x_axis.cfg into the park variables
# shortly after every Klipper start, so they never drift from the real endstops.
[delayed_gcode _TOOLCHANGE_INIT]
initial_duration: 0.1
gcode:
  {% set settings = printer.configfile.settings %}
  SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=t0_park_x VALUE={settings.stepper_x.position_endstop}
  SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=t1_park_x VALUE={settings.dual_carriage.position_endstop}

[gcode_macro T0]
description: Park T1, activate T0, wait for T0 to reach its target, restore Z
gcode:
  {% if printer["gcode_macro _COPY_MIRROR_VARS"].mode != 0 %}
    # SET_DUAL_CARRIAGE CARRIAGE=n defaults to MODE=PRIMARY and would
    # break copy/mirror sync — ignore tool changes while synced
    RESPOND TYPE=echo MSG="T0 ignored — copy/mirror mode active"
  {% else %}
    {% set toolchange          = printer["gcode_macro _TOOLCHANGE_VARS"] %}
    {% set t0_target  = printer.extruder.target | float %}   # set by the slicer (M104) before the tool change
    {% set homed      = 'z' in printer.toolhead.homed_axes %}
    {% set saved_z    = printer.toolhead.position.z if homed else 0 %}
    {% set feed       = printer.gcode_move.speed %}   # mm/s the slicer had set — put it back at the end
    {% if printer.toolhead.extruder == "extruder1" %}
      SAVE_GCODE_STATE NAME=toolchange_state
      {% if homed %}
        G91
        G1 Z{toolchange.z_drop_mm} F{20 * 60}
        G90
      {% endif %}
      # Park T1 (the slicer handles its standby temperature)
      SET_DUAL_CARRIAGE CARRIAGE=1
      G0 X{toolchange.t1_park_x} F{toolchange.park_speed * 60}
      RESTORE_GCODE_STATE NAME=toolchange_state MOVE=0
    {% endif %}
    ACTIVATE_EXTRUDER EXTRUDER=extruder
    SET_DUAL_CARRIAGE CARRIAGE=0
    SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0
    # Wait for T0 to reach the target the slicer set, while still parked
    {% if t0_target > 0 %}
      TEMPERATURE_WAIT SENSOR=extruder MINIMUM={t0_target - 2}
    {% endif %}
    # Now restore Z and return to print position
    {% if homed %}
      G1 Z{saved_z} F{20 * 60}
    {% endif %}
    G90
    G1 F{feed * 60}                    # the Z move above left F1200 — restore the slicer's feedrate
  {% endif %}

[gcode_macro T1]
description: Park T0, activate T1, wait for T1 to reach its target, restore Z
gcode:
  {% if printer["gcode_macro _COPY_MIRROR_VARS"].mode != 0 %}
    # SET_DUAL_CARRIAGE CARRIAGE=n defaults to MODE=PRIMARY and would
    # break copy/mirror sync — ignore tool changes while synced
    RESPOND TYPE=echo MSG="T1 ignored — copy/mirror mode active"
  {% else %}
    {% set toolchange          = printer["gcode_macro _TOOLCHANGE_VARS"] %}
    {% set saved        = printer.save_variables.variables %}
    {% set x_off      = saved.t1_x_offset | default(0) | float %}
    {% set y_off      = saved.t1_y_offset | default(0) | float %}
    {% set z_off      = saved.t1_z_offset | default(0) | float %}
    {% set t1_target  = printer.extruder1.target | float %}   # set by the slicer (M104) before the tool change
    {% set homed      = 'z' in printer.toolhead.homed_axes %}
    {% set saved_z    = printer.toolhead.position.z if homed else 0 %}
    {% set feed       = printer.gcode_move.speed %}   # mm/s the slicer had set — put it back at the end
    {% if printer.toolhead.extruder == "extruder" %}
      SAVE_GCODE_STATE NAME=toolchange_state
      {% if homed %}
        G91
        G1 Z{toolchange.z_drop_mm} F{20 * 60}
        G90
      {% endif %}
      # Park T0 (the slicer handles its standby temperature)
      SET_DUAL_CARRIAGE CARRIAGE=0
      G0 X{toolchange.t0_park_x} F{toolchange.park_speed * 60}
      RESTORE_GCODE_STATE NAME=toolchange_state MOVE=0
    {% endif %}
    ACTIVATE_EXTRUDER EXTRUDER=extruder1
    SET_DUAL_CARRIAGE CARRIAGE=1
    SET_GCODE_OFFSET X={x_off} Y={y_off} Z={z_off} MOVE=0
    # Wait for T1 to reach the target the slicer set, while still parked
    {% if t1_target > 0 %}
      TEMPERATURE_WAIT SENSOR=extruder1 MINIMUM={t1_target - 2}
    {% endif %}
    # Now restore Z and return to print position
    {% if homed %}
      G1 Z{saved_z} F{20 * 60}
    {% endif %}
    G90
    G1 F{feed * 60}                    # the Z move above left F1200 — restore the slicer's feedrate
  {% endif %}

#####################################################################
# Start / End Print Macros
# Customise to your slicer's start/end g-code calls
#####################################################################

[gcode_macro PRINT_START]
# OrcaSlicer machine start G-code:
#   PRINT_START BED={bed_temperature[0]} CHAMBER={chamber_temperature[0]} T0={if is_extruder_used[0]}{nozzle_temperature[0]}{else}0{endif} T1={if is_extruder_used[1]}{nozzle_temperature[1]}{else}0{endif} FIRST_TOOL={initial_tool}
# Orca passes every slot's nozzle temp even when that tool is unused, so the
# is_extruder_used guard sends 0 for unused tools — 0 means "leave heater off".
# FIRST_TOOL=0 → T0 prints first; FIRST_TOOL=1 → T1 prints first.
# The first tool heats to full print temp; the other stays off (both heat in
# COPY/MIRROR). Standby and preheat of the idle tool are handled by OrcaSlicer
# (ooze prevention / standby temperature delta / preheat time).
#
# Print mode: OrcaSlicer emits SET_PRINT_MODE MODE=PRIMARY|COPY|MIRROR per
# sliced mode. If it arrives before PRINT_START, the mode is engaged at the
# end of this macro (after homing/mesh); if after, SET_PRINT_MODE engages it
# immediately. In COPY/MIRROR both tools heat to full temp, FIRST_TOOL is
# ignored, and T1 uses T0's temp when the slicer passes T1=0.
gcode:
  {% set copy_mirror           = printer["gcode_macro _COPY_MIRROR_VARS"] %}
  {% set PRINT_MODE   = copy_mirror.pending_mode | int %}
  {% set DUAL         = PRINT_MODE != 0 %}
  {% set BED_TEMP     = params.BED        | default(60) | float %}
  {% set CHAMBER_TEMP = params.CHAMBER    | default(0)  | float %}
  {% set T0_TEMP      = params.T0         | default(0)  | float %}
  {% set T1_PARAM     = params.T1         | default(0)  | float %}
  {% set T1_TEMP      = T0_TEMP if (DUAL and T1_PARAM <= 0) else T1_PARAM %}
  {% set FIRST_TOOL   = 0 if DUAL else (params.FIRST_TOOL | default(0) | int) %}
  SET_GCODE_VARIABLE MACRO=_COPY_MIRROR_VARS VARIABLE=start_done VALUE=0
  # Store slicer temps so T0/T1 tool-change macros always restore correctly
  SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=t0_print_temp VALUE={T0_TEMP}
  SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=t1_print_temp VALUE={T1_TEMP}
  # Persist print temps so brush macros can heat to last-known-temp minus offset
  {% if T0_TEMP > 0 %}
    SAVE_VARIABLE VARIABLE=t0_last_print_temp VALUE={T0_TEMP}
  {% endif %}
  {% if T1_TEMP > 0 %}
    SAVE_VARIABLE VARIABLE=t1_last_print_temp VALUE={T1_TEMP}
  {% endif %}
  # Bed and chamber heat together — both targets set before either wait,
  # and nothing else starts until both are at temp.
  SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={BED_TEMP}
  {% if CHAMBER_TEMP > 0 %}
    SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={CHAMBER_TEMP}
  {% endif %}
  TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={BED_TEMP}
  {% if CHAMBER_TEMP > 0 %}
    TEMPERATURE_WAIT SENSOR="heater_generic chamber_heater" MINIMUM={CHAMBER_TEMP}
  {% endif %}
  # Hotends stay at touch temp through homing/tilt/mesh and only go to print
  # temp at the very end — they heat fast, and this avoids repeated
  # heat/cool cycles around the Cartographer touches (150 °C limit).
  # T0 sits at touch_temp so the nozzle is warm but touch-safe; T1 stays off.
  {% set touch_temp = printer["gcode_macro CARTOGRAPHER_TOUCH_HOME"].touch_temp %}
  SET_HEATER_TEMPERATURE HEATER=extruder TARGET={touch_temp}
  SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET=0
  # Cartographer is on T0 — select it directly; the T0 macro would heat to print temp and wait
  SET_DUAL_CARRIAGE CARRIAGE=0
  ACTIVATE_EXTRUDER EXTRUDER=extruder
  SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0
  G28                                 # Home all axes (Z → X → Y → CARTOGRAPHER_TOUCH_HOME)
  TOUCH_BRUSH                         # hot wipe, then keep wiping while T0 cools to touch temp (leaves T0 at touch temp)
  Z_TILT_ADJUST                       # Level gantry via Cartographer probe
  _TOUCH_HOME_CENTER                  # re-touch — Z=0 may shift after tilt correction
  BED_MESH_CALIBRATE                  # Cartographer scan — T0 must remain active
  # Now heat for printing: first tool to print temp
  # (copy/mirror: both to print temp — they print together)
  # The other tool stays off — the slicer's standby/preheat (M104) takes it from there
  {% if FIRST_TOOL == 0 %}
    {% if T0_TEMP > 0 %}
      SET_HEATER_TEMPERATURE HEATER=extruder TARGET={T0_TEMP}
    {% endif %}
    {% if DUAL and T1_TEMP > 0 %}
      SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET={T1_TEMP}
    {% endif %}
  {% else %}
    {% if T1_TEMP > 0 %}
      SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET={T1_TEMP}
    {% endif %}
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0   # drop T0 from touch temp
  {% endif %}
  # Wait only for the first-used tool — the other tool is heated by the slicer's preheat
  {% if FIRST_TOOL == 0 %}
    {% if T0_TEMP > 0 %}
      TEMPERATURE_WAIT SENSOR=extruder MINIMUM={T0_TEMP}
    {% endif %}
  {% else %}
    {% if T1_TEMP > 0 %}
      TEMPERATURE_WAIT SENSOR=extruder1 MINIMUM={T1_TEMP}
    {% endif %}
  {% endif %}
  {% if DUAL %}
    # Waits for T1 to reach temp, then positions carriages and engages sync
    _APPLY_PRINT_MODE MODE={PRINT_MODE}
  {% elif FIRST_TOOL == 1 %}
    # Activate first tool (applies gcode offset; T1 macro also does final temp check)
    T1
  {% else %}
    T0
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_COPY_MIRROR_VARS VARIABLE=start_done VALUE=1

#####################################################################
# PRINT_END
# OrcaSlicer: Machine G-code → Machine end G-code → PRINT_END
#####################################################################

[gcode_macro PRINT_END]
description: End-of-print — park toolhead, heaters off, open Nevermore vent
gcode:
  {% set toolchange  = printer['gcode_macro _TOOLCHANGE_VARS'] %}
  {% set copy_mirror  = printer['gcode_macro _COPY_MIRROR_VARS'] %}
  {% set max_z = printer.toolhead.axis_maximum.z %}
  {% set cur_z = printer.toolhead.position.z %}
  {% set new_z = [cur_z + 20.0, max_z] | min %}
  TURN_OFF_HEATERS
  M107                                 # part cooling off
  {% if printer.extruder.can_extrude %}
    G91
    G1 E-3.0 F{35 * 60}               # retract to avoid ooze
    G90
  {% endif %}
  G1 Z{new_z} F{20 * 60}              # lift
  {% if copy_mirror.mode != 0 %}
    DEACTIVATE_COPY_MIRROR_MODE
    SET_DUAL_CARRIAGE CARRIAGE=1
    G1 X{toolchange.t1_park_x} F{toolchange.park_speed * 60}
    SET_DUAL_CARRIAGE CARRIAGE=0
    G1 X{toolchange.t0_park_x} F{toolchange.park_speed * 60}
  {% elif printer.toolhead.extruder == "extruder" %}
    G1 X{toolchange.t0_park_x} F{toolchange.park_speed * 60}
  {% else %}
    G1 X{toolchange.t1_park_x} F{toolchange.park_speed * 60}
  {% endif %}
  G1 Y10 F{100 * 60}                  # Y to front
  M84                                  # steppers off
  NEVERMORE_VENT_OPEN                  # open vent to exhaust
  _RESET_PRINT_MODE
  # Nevermore fan continues running per fan_policy_cooldown (15 min)

#####################################################################
# Filament Runout / Insert
#####################################################################

[gcode_macro FILAMENT_RUNOUT]
description: Called by filament sensor on runout — alerts and pauses if printing
gcode:
  {% set T = params.T | default(0) | int %}
  RESPOND TYPE=error MSG="Filament runout on T{T}!"
  {% if printer.print_stats.state == "printing" %}
    PAUSE
  {% endif %}

[gcode_macro FILAMENT_INSERT]
description: Called by filament sensor on insert — automatically loads filament
gcode:
  {% set T = params.T | default(0) | int %}
  RESPOND TYPE=echo MSG="Filament detected in T{T} — starting load"
  FILAMENT_LOAD T={T}

#####################################################################
# Filament Unload with Tip Forming
#
# Geometry (from your measurements):
#   Entry sensor → extruder gear : 36 mm
#   Extruder gear → nozzle tip   : 82 mm
#   Nozzle tip → cooling tube    : 26 mm  (melt zone length)
#   Cooling tube length          : 18 mm
#
# Tip-forming sequence (based on SuperSlicer / Happy-Hare method):
#   1. Ram   — pressure pulses build a clean blob at the tip
#   2. Retract — tapered pull drags tip into the cooling tube
#   3. Cool  — oscillate in cooling tube to solidify the tip shape
#   4. Skinnydip (optional) — brief re-dip burns off fine hairs
#   5. Unload — fast pull past the entry sensor
#
# Call:  FILAMENT_UNLOAD T=0   or   FILAMENT_UNLOAD T=1
#####################################################################

[gcode_macro FILAMENT_UNLOAD_VARS]
# ---- Hotend geometry (mm) ----
variable_sensor_to_gear:        36    # entry sensor → extruder gear
variable_gear_to_nozzle:        82    # extruder gear → nozzle tip
variable_melt_zone_length:      26    # nozzle tip → start of cooling tube
variable_cooling_tube_length:   18    # length of cooling tube in heatsink
# ---- Safe operating temperature ----
variable_safe_temp:            240    # °C — heat to this if nozzle is too cold
# ---- Ramming ----
variable_ramming_volume:        23    # mm³ to push before retracting (0 = skip)
# ---- Retraction speeds (mm/s) ----
variable_unloading_speed_start: 80    # initial fast retract
variable_unloading_speed:       20    # main tapered retract
# ---- Cooling moves ----
variable_initial_cooling_speed: 10    # mm/s at start of cooling oscillations
variable_final_cooling_speed:   40    # mm/s at end of cooling oscillations
variable_cooling_moves:          4    # number of in/out oscillation cycles
# ---- Skinnydip (burns fine PLA hairs — disable for PETG/ABS) ----
variable_use_skinnydip:          0    # 1 = enable, 0 = disable
variable_skinnydip_distance:    30    # mm to re-insert into melt zone
variable_dip_insertion_speed:   33    # mm/s insertion
variable_dip_extraction_speed:  70    # mm/s extraction
variable_melt_zone_pause:        0    # ms pause at bottom of dip
variable_cooling_zone_pause:  2000    # ms pause after extraction
# ---- Final unload ----
variable_unload_speed:          50    # mm/s for fast pull past sensor
variable_unload_safety_margin:  20    # mm extra travel beyond sensor
# ---- Load ----
variable_load_speed_fast:       50    # mm/s while feeding through cold zone
variable_load_speed_slow:       10    # mm/s once entering the melt zone
variable_load_slow_start:       15    # mm before nozzle tip to switch to slow
variable_filament_diameter:   1.75    # mm
variable_purge_volume:          72    # mm³ default purge (≈30 mm of 1.75 mm filament)
variable_purge_min_volume:      30    # mm³ — purge is never less than this (0.4 mm nozzle)
variable_purge_flow:            12    # mm³/s volumetric flow during purge
variable_purge_min_temp:       220    # °C — refuse to purge below this nozzle temp
variable_purge_x_offset:        10    # mm outboard of own brush (T0: brush-10, T1: brush edge+10)
variable_min_z:                 20    # minimum Z (mm) before moving to the purge spot
gcode:  # variable holder

# Home if needed, move the toolhead to its purge spot (own brush, 10 mm
# outboard, Z >= min_z), then extrude. VOLUME=0 does the homing/move only.
# Safe to call repeatedly — if already at the spot the move is a no-op.
# Call:  FILAMENT_PURGE T=0   or   FILAMENT_PURGE T=1 VOLUME=60
[gcode_macro FILAMENT_PURGE]
description: Home if needed, move to purge spot, purge VOLUME mm³ (min purge_min_volume). T=0 or T=1
gcode:
  {% set T        = params.T | default(0) | int %}
  {% set filament        = printer['gcode_macro FILAMENT_UNLOAD_VARS'] %}
  {% set brush       = printer['gcode_macro BRUSH_VARS'] %}
  {% set heater   = 'extruder1' if T == 1 else 'extruder' %}
  {% set was_homed = printer.toolhead.homed_axes == "xyz" %}
  {% set req_vol  = params.VOLUME | default(filament.purge_volume) | float %}
  # Any non-zero request is raised to the minimum so the nozzle always clears
  {% set vol      = ([req_vol, filament.purge_min_volume] | max) if req_vol > 0 else 0 %}
  {% set area     = 3.14159265 * (filament.filament_diameter / 2) ** 2 %}
  {% set e_len    = vol / area %}
  {% set e_speed  = filament.purge_flow / area %}
  {% set purge_x  = (brush.t1_brush_x_start + brush.brush_width + filament.purge_x_offset) if T == 1 else (brush.t0_brush_x_start - filament.purge_x_offset) %}
  {% set purge_y  = brush.t1_brush_y if T == 1 else brush.t0_brush_y %}

  # Home first if needed — the move below requires known XYZ
  {% if not was_homed %}
    RESPOND TYPE=echo MSG="Filament purge: axes not homed, homing first"
    G28
  {% endif %}

  G90
  # Raise to at least min_z before travelling; never lower if already higher.
  # Templates render before G28 runs, so the Z read is stale after homing —
  # in that case lift unconditionally.
  {% if not was_homed or printer.toolhead.position.z < filament.min_z %}
    G1 Z{filament.min_z} F{20 * 60}
  {% endif %}

  # Activate the requested toolhead via T0/T1: parks the other toolhead at its
  # endstop and applies this tool's gcode offsets.
  # No SAVE/RESTORE_GCODE_STATE around it — restoring would put the previous
  # tool's offsets back while this tool is active.
  T{T}
  G90
  G1 X{purge_x} Y{purge_y} F{brush.approach_speed * 60}

  {% if vol > 0 %}
    {% if printer[heater].temperature < filament.purge_min_temp %}
      { action_raise_error("FILAMENT_PURGE: T%d nozzle too cold to purge (%.0f°C, min %d°C)" % (T, printer[heater].temperature, filament.purge_min_temp)) }
    {% endif %}
    RESPOND TYPE=echo MSG="T{T} purging {vol | round(1)} mm³ ({e_len | round(1)} mm filament)"
    M83   # Relative extrusion
    G92 E0
    G1 E{e_len | round(2)} F{(e_speed * 60) | round(1)}
  {% endif %}
  G90

[gcode_macro FILAMENT_UNLOAD]
description: Form tip then unload filament past entry sensor. T=0 or T=1 TEMP=240
gcode:
  {% set T           = params.T    | default(0)                                   | int %}
  {% set filament           = printer['gcode_macro FILAMENT_UNLOAD_VARS'] %}
  {% set saved          = printer.save_variables.variables %}
  {% set last_temp   = saved['t%d_last_print_temp' % T] | default(0) | float %}
  {% set req_temp    = params.TEMP | default(0) | float %}
  # An explicit TEMP param is the user explicitly telling us the temp they
  # want — honor it outright. Otherwise fall back to the last known print
  # temp for this tool (the actual temp the filament in the nozzle needs to
  # flow), and only fall back further to the generic safe_temp if neither
  # is known (e.g. true first-ever run with no save data).
  {% set target_temp = (req_temp if req_temp > 0 else (last_temp if last_temp > 0 else filament.safe_temp)) | int %}
  {% set heater      = 'extruder1' if T == 1 else 'extruder' %}
  {% set prev_target = printer[heater].target | float %}

  # Home if needed, activate the toolhead (T0/T1 parks the other one)
  # and move to the purge spot before any extrusion
  FILAMENT_PURGE T={T} VOLUME=0

  # Heat to safe temp if nozzle is too cold to extrude
  {% if prev_target < target_temp %}
    RESPOND TYPE=echo MSG="T{T} unload: heating to {target_temp}°C"
    SET_HEATER_TEMPERATURE HEATER={heater} TARGET={target_temp}
    TEMPERATURE_WAIT SENSOR={heater} MINIMUM={target_temp}
  {% endif %}

  # Derived distances
  {% set cooling_tube_pos = filament.gear_to_nozzle - filament.melt_zone_length %}
  {% set total_unload     = filament.gear_to_nozzle + filament.sensor_to_gear + filament.unload_safety_margin %}
  {% set final_pull       = total_unload - cooling_tube_pos %}

  SAVE_GCODE_STATE NAME=unload_state
  G91   # Relative positioning
  M83   # Relative extrusion
  G92 E0

  # ---- Step 1: Ramming ----
  {% if filament.ramming_volume > 0 %}
    {% set ram_scale = filament.ramming_volume / 23.0 %}
    G1 E{0.5784 * ram_scale} F299
    G1 E{0.5834 * ram_scale} F302
    G1 E{0.5918 * ram_scale} F306
    G1 E{0.6169 * ram_scale} F319
    G1 E{0.3393 * ram_scale} F350
    G1 E{0.3363 * ram_scale} F350
    G1 E{0.7577 * ram_scale} F392
    G1 E{0.8382 * ram_scale} F434
    G1 E{0.7776 * ram_scale} F469
    G1 E{0.1293 * ram_scale} F469
    G1 E{0.9673 * ram_scale} F501
    G1 E{1.0176 * ram_scale} F527
    G1 E{0.5956 * ram_scale} F544
    G1 E{0.4555 * ram_scale} F544
    G1 E{1.0662 * ram_scale} F552
  {% endif %}

  # ---- Step 2: Tapered retraction into cooling tube ----
  {% set tail = cooling_tube_pos - 15 %}
  G1 E-15 F{filament.unloading_speed_start * 60}
  {% if tail > 0 %}
    G1 E-{(tail * 0.7) | round(2)} F{filament.unloading_speed * 60}
    G1 E-{(tail * 0.2) | round(2)} F{(filament.unloading_speed * 0.5 * 60) | int}
    G1 E-{(tail * 0.1) | round(2)} F{(filament.unloading_speed * 0.3 * 60) | int}
  {% endif %}

  # ---- Step 3: Cooling moves ----
  {% set denom   = [2 * filament.cooling_moves - 1, 1] | max %}
  {% set spd_inc = (filament.final_cooling_speed - filament.initial_cooling_speed) / denom %}
  {% for i in range(filament.cooling_moves) %}
    {% set cool_speed = filament.initial_cooling_speed + spd_inc * i * 2 %}
    G1 E{ filament.cooling_tube_length}  F{(cool_speed * 60)             | int}
    G1 E-{filament.cooling_tube_length}  F{((cool_speed + spd_inc) * 60) | int}
  {% endfor %}

  # ---- Step 4: Skinnydip (optional) ----
  {% if filament.use_skinnydip %}
    G1 E{ filament.skinnydip_distance} F{filament.dip_insertion_speed  * 60}
    G4 P{filament.melt_zone_pause}
    G1 E-{filament.skinnydip_distance} F{filament.dip_extraction_speed * 60}
    G4 P{filament.cooling_zone_pause}
  {% endif %}

  # ---- Step 5: Full unload past entry sensor ----
  G1 E-{final_pull | round(1)} F{filament.unload_speed * 60}

  RESTORE_GCODE_STATE NAME=unload_state
  # Restore heater to its previous target
  SET_HEATER_TEMPERATURE HEATER={heater} TARGET={prev_target | int}
  RESPOND TYPE=echo MSG="T{T} unloaded"
  G90

[gcode_macro FILAMENT_LOAD]
description: Feed filament from sensor to nozzle and purge. T=0 or T=1 TEMP=240
gcode:
  {% set T           = params.T    | default(0)                                   | int %}
  {% set filament           = printer['gcode_macro FILAMENT_UNLOAD_VARS'] %}
  {% set saved          = printer.save_variables.variables %}
  {% set last_temp   = saved['t%d_last_print_temp' % T] | default(0) | float %}
  {% set req_temp    = params.TEMP | default(0) | float %}
  # An explicit TEMP param is the user explicitly telling us the temp they
  # want — honor it outright. Otherwise fall back to the last known print
  # temp for this tool (so residual filament from a hotter material still
  # purges out), and only fall back further to the generic safe_temp if
  # neither is known (e.g. true first-ever run with no save data).
  {% set target_temp = (req_temp if req_temp > 0 else (last_temp if last_temp > 0 else filament.safe_temp)) | int %}
  {% set heater      = 'extruder1' if T == 1 else 'extruder' %}
  {% set prev_target = printer[heater].target | float %}

  # Home if needed, activate the toolhead (T0/T1 parks the other one)
  # and move to the purge spot before any extrusion
  FILAMENT_PURGE T={T} VOLUME=0

  # Heat to safe temp if nozzle is too cold to extrude
  {% if prev_target < target_temp %}
    RESPOND TYPE=echo MSG="T{T} load: heating to {target_temp}°C"
    SET_HEATER_TEMPERATURE HEATER={heater} TARGET={target_temp}
    TEMPERATURE_WAIT SENSOR={heater} MINIMUM={target_temp}
  {% endif %}

  # Distances: fast feed through cold zone, slow through melt zone, then purge
  {% set fast_dist = filament.sensor_to_gear + filament.gear_to_nozzle - filament.load_slow_start %}
  {% set slow_dist = filament.load_slow_start %}

  SAVE_GCODE_STATE NAME=load_state
  G91   # Relative positioning
  M83   # Relative extrusion
  G92 E0

  # Fast feed from sensor through cold zone, stopping before melt zone
  RESPOND TYPE=echo MSG="T{T} loading..."
  G1 E{fast_dist | round(1)} F{filament.load_speed_fast * 60}
  # Slow feed through melt zone to nozzle tip
  G1 E{slow_dist}            F{filament.load_speed_slow * 60}
  # Purge to confirm flow and clear old filament (at the purge spot)
  FILAMENT_PURGE T={T}

  RESTORE_GCODE_STATE NAME=load_state
  # Restore heater to its previous target
  SET_HEATER_TEMPERATURE HEATER={heater} TARGET={prev_target | int}
  # Nozzle now holds the new filament — record its temp so the next
  # load/unload knows the real residual temp instead of the old filament's
  {% if req_temp > 0 %}
    SAVE_VARIABLE VARIABLE=t{T}_last_print_temp VALUE={req_temp}
  {% endif %}
  RESPOND TYPE=echo MSG="T{T} loaded and purged"
  G90

#####################################################################
# IDEX Copy & Mirror Modes
#
# COPY   — both carriages move in the same X direction, same speed.
#          T1 starts at an X offset from T0.  Prints two identical
#          parts simultaneously side-by-side.
#
# MIRROR — T1 moves in the opposite X direction to T0.
#          T1 starts at the mirror-image X position.
#          Prints two mirrored parts simultaneously.
#
# Variables to set:
#   copy_x_start   — X position T0 homes to before entering copy mode
#   copy_x_t1      — X position T1 is placed at before copy mode engages
#                    (= T0 start + half bed width for symmetric copy)
#   mirror_x_t1    — X position T1 is placed at before mirror mode engages
#                    (= bed_max_x - copy_x_start for symmetric mirror)
#
# Input shaper values per mode can be filled in once measured.
# Leave at 0 to skip shaper changes.
#####################################################################

[gcode_macro _COPY_MIRROR_VARS]
variable_copy_x_start:    5.0    # T0 X start for copy/mirror (left edge of print)
variable_copy_x_t1:     205.0    # T1 X start for copy mode  (= copy_x_start + 200 mm)
                                 # gives 200 mm per part — matches FORMBOT COPY spec
variable_mirror_x_t1:   330.0    # T1 X start for mirror mode (mirror plane ≈ 167 mm)
                                 # gives ~162 mm per part — matches FORMBOT MIRROR spec
variable_mode:            0      # 0=normal 1=copy 2=mirror — do not edit
variable_pending_mode:    0      # mode requested by SET_PRINT_MODE — do not edit
variable_start_done:      0      # 1 once PRINT_START has finished — do not edit
# Input shaper overrides per mode (set to 0 to skip)
variable_copy_shaper_freq_x:    0
variable_copy_shaper_freq_y:    0
variable_mirror_shaper_freq_x:  0
variable_mirror_shaper_freq_y:  0
gcode:  # variable holder

[gcode_macro ACTIVATE_COPY_MODE]
description: Engage IDEX copy mode — prints two identical parts simultaneously
gcode:
  {% set copy_mirror = printer["gcode_macro _COPY_MIRROR_VARS"] %}
  RESPOND TYPE=echo MSG="Activating COPY mode"
  # Bring both carriages to primary mode first to allow independent moves
  SET_DUAL_CARRIAGE CARRIAGE=1 MODE=PRIMARY
  G90
  G1 X{copy_mirror.copy_x_t1} F{printer["gcode_macro _TOOLCHANGE_VARS"].park_speed * 60}
  SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
  ACTIVATE_EXTRUDER EXTRUDER=extruder
  G1 X{copy_mirror.copy_x_start} F{printer["gcode_macro _TOOLCHANGE_VARS"].park_speed * 60}
  # Engage copy mode and sync extruder motion
  SET_DUAL_CARRIAGE CARRIAGE=1 MODE=COPY
  SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder
  SET_GCODE_VARIABLE MACRO=_COPY_MIRROR_VARS VARIABLE=mode VALUE=1
  # Optional input shaper override for copy mode
  {% if copy_mirror.copy_shaper_freq_x > 0 %}
    SET_INPUT_SHAPER SHAPER_FREQ_X={copy_mirror.copy_shaper_freq_x} SHAPER_FREQ_Y={copy_mirror.copy_shaper_freq_y}
  {% endif %}
  RESPOND TYPE=echo MSG="COPY mode active — T1 offset from T0 by {copy_mirror.copy_x_t1 - copy_mirror.copy_x_start} mm"

[gcode_macro ACTIVATE_MIRROR_MODE]
description: Engage IDEX mirror mode — prints two mirrored parts simultaneously
gcode:
  {% set copy_mirror = printer["gcode_macro _COPY_MIRROR_VARS"] %}
  RESPOND TYPE=echo MSG="Activating MIRROR mode"
  # Bring both carriages to primary mode first to allow independent moves
  SET_DUAL_CARRIAGE CARRIAGE=1 MODE=PRIMARY
  G90
  G1 X{copy_mirror.mirror_x_t1} F{printer["gcode_macro _TOOLCHANGE_VARS"].park_speed * 60}
  SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
  ACTIVATE_EXTRUDER EXTRUDER=extruder
  G1 X{copy_mirror.copy_x_start} F{printer["gcode_macro _TOOLCHANGE_VARS"].park_speed * 60}
  # Engage mirror mode and sync extruder motion
  SET_DUAL_CARRIAGE CARRIAGE=1 MODE=MIRROR
  SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder
  SET_GCODE_VARIABLE MACRO=_COPY_MIRROR_VARS VARIABLE=mode VALUE=2
  # Optional input shaper override for mirror mode
  {% if copy_mirror.mirror_shaper_freq_x > 0 %}
    SET_INPUT_SHAPER SHAPER_FREQ_X={copy_mirror.mirror_shaper_freq_x} SHAPER_FREQ_Y={copy_mirror.mirror_shaper_freq_y}
  {% endif %}
  RESPOND TYPE=echo MSG="MIRROR mode active"

[gcode_macro DEACTIVATE_COPY_MIRROR_MODE]
description: Return both carriages to normal independent IDEX mode
gcode:
  {% set copy_mirror = printer["gcode_macro _COPY_MIRROR_VARS"] %}
  {% if copy_mirror.mode != 0 %}
    RESPOND TYPE=echo MSG="Deactivating copy/mirror mode — returning to IDEX"
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=
    SET_DUAL_CARRIAGE CARRIAGE=1 MODE=PRIMARY
    SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
    ACTIVATE_EXTRUDER EXTRUDER=extruder
    SET_GCODE_VARIABLE MACRO=_COPY_MIRROR_VARS VARIABLE=mode VALUE=0
    # Restore per-carriage input shaper values if they were overridden
    # ([input_shaper] is empty under dual_carriage, so read from save_variables)
    {% if copy_mirror.copy_shaper_freq_x > 0 or copy_mirror.mirror_shaper_freq_x > 0 %}
      _APPLY_SHAPERS                   # leaves carriage 0 active
    {% endif %}
  {% endif %}

#####################################################################
# SET_PRINT_MODE — OrcaSlicer per-mode G-code hook
#
# OrcaSlicer emits one of:
#   SET_PRINT_MODE MODE=PRIMARY | COPY | MIRROR
# The request is stored; PRINT_START engages it after homing, Z tilt
# and mesh. If called after PRINT_START has already finished, it is
# engaged immediately. Works regardless of where Orca places it.
#####################################################################

[gcode_macro SET_PRINT_MODE]
description: Select IDEX print mode for this print. MODE=PRIMARY|COPY|MIRROR
gcode:
  {% set modes = {'PRIMARY': 0, 'COPY': 1, 'MIRROR': 2} %}
  {% set MODE  = params.MODE | default('PRIMARY') | upper %}
  {% if MODE not in modes %}
    { action_raise_error("SET_PRINT_MODE: unknown MODE=%s (use PRIMARY, COPY or MIRROR)" % MODE) }
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_COPY_MIRROR_VARS VARIABLE=pending_mode VALUE={modes[MODE]}
  {% if printer["gcode_macro _COPY_MIRROR_VARS"].start_done %}
    _APPLY_PRINT_MODE MODE={modes[MODE]}
  {% else %}
    RESPOND TYPE=echo MSG="Print mode {MODE} requested — engaged at end of PRINT_START"
  {% endif %}

[gcode_macro _APPLY_PRINT_MODE]
description: Engage IDEX mode now. MODE=0 (primary) 1 (copy) 2 (mirror)
gcode:
  {% set MODE    = params.MODE | int %}
  {% set copy_mirror      = printer["gcode_macro _COPY_MIRROR_VARS"] %}
  {% set toolchange      = printer["gcode_macro _TOOLCHANGE_VARS"] %}
  {% set z_off   = printer.save_variables.variables.t1_z_offset | default(0) | float %}
  {% set t1_temp = (toolchange.t1_print_temp if toolchange.t1_print_temp > 0 else toolchange.t0_print_temp) | float %}
  {% if MODE == copy_mirror.mode %}
    RESPOND TYPE=echo MSG="Print mode already active"
  {% elif MODE == 0 %}
    DEACTIVATE_COPY_MIRROR_MODE
    T0
  {% else %}
    DEACTIVATE_COPY_MIRROR_MODE        # only acts when switching copy <-> mirror
    T0                                 # park T1, clear T1 gcode offset, T0 at temp
    # Both nozzles share one gcode offset while synced — T1's calibrated
    # X/Y offset just shifts its part, but a Z offset cannot be compensated.
    {% if z_off | abs > 0.05 %}
      RESPOND TYPE=echo MSG="WARNING: T1 Z offset {'%.3f' % z_off} mm cannot be applied in copy/mirror — level the nozzles or T1's first layer will be off"
    {% endif %}
    # Both tools print together — bring T1 to full temp (covers SET_PRINT_MODE
    # arriving after PRINT_START, when T1 was still off or on standby)
    SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=t1_print_temp VALUE={t1_temp}
    {% if t1_temp > 0 %}
      SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET={t1_temp}
      TEMPERATURE_WAIT SENSOR=extruder1 MINIMUM={t1_temp}
    {% endif %}
    {% if MODE == 1 %}
      ACTIVATE_COPY_MODE
    {% else %}
      ACTIVATE_MIRROR_MODE
    {% endif %}
  {% endif %}

[gcode_macro _RESET_PRINT_MODE]
description: Clear print-mode request at end of print so the next one defaults to PRIMARY
gcode:
  SET_GCODE_VARIABLE MACRO=_COPY_MIRROR_VARS VARIABLE=pending_mode VALUE=0
  SET_GCODE_VARIABLE MACRO=_COPY_MIRROR_VARS VARIABLE=start_done VALUE=0
