#####################################################################
# Input Shaper Calibration — per-toolhead IDEX
#
# T0 full (X + Y):  CALIBRATE_SHAPER_T0  — fully automated
# T1 X only:        CALIBRATE_SHAPER_T1  — measures, prints recommendation
# Both in sequence: CALIBRATE_SHAPER_ALL
#
# Y is a shared gantry — calibrated once with T0, applies to both.
# T1 X is measured separately with the TH1 onboard accelerometer.
# SHAPER_CALIBRATE does not support a runtime chip override, so T1 X
# uses TEST_RESONANCES + calibrate_shaper.py via shell command.
#
# IMPORTANT — dual_carriage + input shaper:
#   Klipper refuses to load [input_shaper] with real parameters when
#   dual_carriage is enabled ("Input shaper parameters cannot be
#   configured via [input_shaper] section with dual_carriage(s)
#   enabled"). That means SAVE_CONFIG must NEVER be used for shaper
#   values here — it writes straight into [input_shaper] and will
#   brick the next restart. Values are saved via SAVE_VARIABLE instead
#   and applied at runtime with SET_INPUT_SHAPER through _APPLY_SHAPERS,
#   fired once at startup by the init_shaper delayed_gcode below.
#
# Workflow:
#   1. CALIBRATE_SHAPER_T0 → console prints recommended T0 X and Y values
#   2. SAVE_SHAPER T0_TYPE=<type> T0_FREQ=<freq> Y_TYPE=<type> Y_FREQ=<freq>
#   3. CALIBRATE_SHAPER_T1 → console prints recommended T1 X values
#   4. SAVE_SHAPER T1_TYPE=<type> T1_FREQ=<freq>
#   SAVE_SHAPER applies immediately and persists across restarts —
#   no SAVE_CONFIG needed or wanted.
#####################################################################

[gcode_shell_command _analyze_shaper_t1_x]
command:    bash -c "latest=$(ls -t /tmp/resonances_x_*.csv 2>/dev/null | head -1) && [ -n \"$latest\" ] && ~/klipper/scripts/calibrate_shaper.py \"$latest\" -o /tmp/shaper_t1_x.png || echo 'No resonance CSV found — run CALIBRATE_SHAPER_T1 first'"
timeout:    60
verbose:    True

[gcode_macro CALIBRATE_SHAPER_T0]
description: Auto-calibrate input shaper for T0 X and Y using TH0 accelerometer
gcode:
  {% if not 'x' in printer.toolhead.homed_axes or
        not 'y' in printer.toolhead.homed_axes or
        not 'z' in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  T0
  G90
  G1 Z10 F{20 * 60}
  G1 X200 Y208 F{100 * 60}
  RESPOND TYPE=echo MSG="=== Calibrating T0 X shaper (TH0 accelerometer) ==="
  SHAPER_CALIBRATE AXIS=X
  RESPOND TYPE=echo MSG="=== Calibrating Y shaper (shared gantry) ==="
  SHAPER_CALIBRATE AXIS=Y
  RESPOND TYPE=echo MSG="=== T0 done — read the recommended TYPE/FREQ above, then run: ==="
  RESPOND TYPE=echo MSG="=== SAVE_SHAPER T0_TYPE=<type> T0_FREQ=<freq> Y_TYPE=<type> Y_FREQ=<freq> ==="

[gcode_macro CALIBRATE_SHAPER_T1]
description: Measure T1 X resonances with TH1 accelerometer and print shaper recommendation
gcode:
  {% if not 'x' in printer.toolhead.homed_axes or
        not 'y' in printer.toolhead.homed_axes or
        not 'z' in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  T1
  G90
  G1 Z10 F{20 * 60}
  G1 X200 Y208 F{100 * 60}
  RESPOND TYPE=echo MSG="=== Measuring T1 X resonances (TH1 accelerometer) ==="
  TEST_RESONANCES AXIS=X ACCEL_CHIP="adxl345 TH1"
  RESPOND TYPE=echo MSG="=== Analysing — recommended values will appear below ==="
  RUN_SHELL_COMMAND CMD=_analyze_shaper_t1_x
  RESPOND TYPE=echo MSG="=== T1 done — read the recommended TYPE/FREQ above, then run: ==="
  RESPOND TYPE=echo MSG="=== SAVE_SHAPER T1_TYPE=<type> T1_FREQ=<freq> ==="

[gcode_macro CALIBRATE_SHAPER_ALL]
description: Calibrate T0 X+Y then measure T1 X — SAVE_SHAPER each result as it's printed
gcode:
  CALIBRATE_SHAPER_T0
  CALIBRATE_SHAPER_T1

#####################################################################
# Persistence — replaces SAVE_CONFIG, which is unusable here
# (dual_carriage forbids real values in [input_shaper]).
#####################################################################

[gcode_macro SAVE_SHAPER]
description: Save calibrated shaper values and apply immediately. SAVE_SHAPER [T0_TYPE=] [T0_FREQ=] [T1_TYPE=] [T1_FREQ=] [Y_TYPE=] [Y_FREQ=]
gcode:
  {% if params.T0_TYPE is defined %}
    SAVE_VARIABLE VARIABLE=shaper_t0_type VALUE='"{params.T0_TYPE}"'
  {% endif %}
  {% if params.T0_FREQ is defined %}
    SAVE_VARIABLE VARIABLE=shaper_t0_freq VALUE={params.T0_FREQ}
  {% endif %}
  {% if params.T1_TYPE is defined %}
    SAVE_VARIABLE VARIABLE=shaper_t1_type VALUE='"{params.T1_TYPE}"'
  {% endif %}
  {% if params.T1_FREQ is defined %}
    SAVE_VARIABLE VARIABLE=shaper_t1_freq VALUE={params.T1_FREQ}
  {% endif %}
  {% if params.Y_TYPE is defined %}
    SAVE_VARIABLE VARIABLE=shaper_y_type VALUE='"{params.Y_TYPE}"'
  {% endif %}
  {% if params.Y_FREQ is defined %}
    SAVE_VARIABLE VARIABLE=shaper_y_freq VALUE={params.Y_FREQ}
  {% endif %}
  RESPOND TYPE=echo MSG="Shaper values saved — applying now."
  _APPLY_SHAPERS

[gcode_macro _APPLY_SHAPERS]
description: Apply saved per-carriage input shaper values (dual_carriage requires this at runtime, not via [input_shaper])
gcode:
  # Fallback defaults below are the last full calibration (2026-10-12):
  #   T0 X: mzv @ 53.8 Hz   T1 X: 2hump_ei @ 86.0 Hz   Y (shared): mzv @ 46.6 Hz
  # SAVE_SHAPER overrides these via save_variables if you recalibrate later.
  {% set svv    = printer.save_variables.variables %}
  {% set t0_type = svv.shaper_t0_type | default("mzv") %}
  {% set t0_freq = svv.shaper_t0_freq | default(53.8) | float %}
  {% set t1_type = svv.shaper_t1_type | default("2hump_ei") %}
  {% set t1_freq = svv.shaper_t1_freq | default(86.0) | float %}
  {% set y_type  = svv.shaper_y_type  | default("mzv") %}
  {% set y_freq  = svv.shaper_y_freq  | default(46.6) | float %}
  {% if t0_freq <= 0 or t1_freq <= 0 or y_freq <= 0 %}
    RESPOND TYPE=echo MSG="WARNING: input shaper not fully calibrated yet — run CALIBRATE_SHAPER_ALL, then SAVE_SHAPER each result"
  {% endif %}
  SET_DUAL_CARRIAGE CARRIAGE=1
  SET_INPUT_SHAPER SHAPER_TYPE_X={t1_type} SHAPER_FREQ_X={t1_freq} SHAPER_TYPE_Y={y_type} SHAPER_FREQ_Y={y_freq}
  SET_DUAL_CARRIAGE CARRIAGE=0
  SET_INPUT_SHAPER SHAPER_TYPE_X={t0_type} SHAPER_FREQ_X={t0_freq} SHAPER_TYPE_Y={y_type} SHAPER_FREQ_Y={y_freq}

[delayed_gcode init_shaper]
initial_duration: 1
gcode:
  _APPLY_SHAPERS
