#####################################################################
# printer.cfg — Top-level Klipper configuration
# IDEX printer — two independent toolheads on shared Y/Z gantry
#####################################################################


[include mainsail.cfg]
[include timelapse.cfg]
[include macros.cfg]
[include mainboard.cfg]
[include toolhead.cfg]
[include x_axis.cfg]
[include y_axis.cfg]
[include z_axis.cfg]
[include cartographer.cfg]
[include homing.cfg]
[include offset.cfg]
[include nozzle_cam.cfg]
[include input_shaper.cfg]
[include chamber_heater.cfg]
[include nevermore.cfg]


#####################################################################
# Printer Kinematics
#####################################################################

[printer]
kinematics:           cartesian
max_velocity:         300
max_accel:            20000
max_z_velocity:       20
max_z_accel:          200
square_corner_velocity: 5.0

#####################################################################
# Idle Timeout
#####################################################################

[idle_timeout]
timeout: 1800   # 30 minutes — steppers/heaters off if idle

#####################################################################
# Arc Support (required for G2/G3 circular brush motion)
#####################################################################

[gcode_arcs]
resolution: 0.5   # mm per arc segment — smaller = smoother circles

#####################################################################
# Input Shaper
#
# MUST stay empty — dual_carriage forbids real parameters here and
# will refuse to start if any are set (even via a SAVE_CONFIG-written
# #*# block). Per-carriage values are applied at runtime instead; see
# input_shaper.cfg (CALIBRATE_SHAPER_T0/T1, SAVE_SHAPER, _APPLY_SHAPERS).
#####################################################################

[input_shaper]

#####################################################################
# Miscellaneous
#####################################################################

[force_move]
enable_force_move: True

[pause_resume]

[respond]

[display_status]

[virtual_sdcard]
path: ~/printer_data/gcodes

[save_variables]
filename: ~/printer_data/config/printer_variables.cfg

