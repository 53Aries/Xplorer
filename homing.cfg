#####################################################################
# Homing Configuration
#
# Centralised homing logic for all axes.
# Stepper parameters (homing_speed, retract_dist, etc.) remain in
# each axis config file — only homing procedures live here.
#####################################################################

#####################################################################
# X Axis Homing — IDEX
#
# Both carriages must be homed independently.
# T0 (stepper_x) homes to Xmin; T1 (dual_carriage) homes to Xmax.
# SET_DUAL_CARRIAGE switches active carriage before each G28 X.
# Inside homing_override, G28 X calls native homing (no recursion).
#####################################################################

[gcode_macro _HOME_X]
description: Home both IDEX carriages
gcode:
  SET_DUAL_CARRIAGE CARRIAGE=0
  G28 X                                 # T0 → Xmin physical endstop
  SET_DUAL_CARRIAGE CARRIAGE=1
  G28 X                                 # T1 → Xmax physical endstop
  SET_DUAL_CARRIAGE CARRIAGE=0          # return to T0 as active carriage

#####################################################################
# Y Axis Homing — dual physical endstops (PF4 / PF3)
# Each motor stops independently on its own endstop, squaring the gantry.
#####################################################################

[gcode_macro _HOME_Y]
description: Home Y with dual physical endstops
gcode:
  G28 Y

#####################################################################
# Homing Override — all axes
#
# Full sequence (bare G28) — order of operations:
#   1. Z  — all three motors lower to Zmax endstops independently (per-stepper trsync)
#   2. X  — T0 homes to Xmin, T1 homes to Xmax (both IDEX carriages)
#   3. Y  — both motors home to Ymax
#   4. CARTOGRAPHER_TOUCH — scanner moves to randomised bed-centre XY,
#            touches bed, sets Z=0 at nozzle contact point
#
# Partial sequences:
#   G28 X      → step 2 only (_HOME_X)
#   G28 Y      → step 3 only (_HOME_Y)
#   G28 Z      → step 1 + step 4 (X and Y must already be homed for step 4)
#   G28 X Y    → steps 2 + 3, no Z
#   G28 X Y Z  → all four steps in order
#
# Inside this override, G28 <axis> calls Klipper's native homing
# (in_script guard prevents recursion).
#####################################################################

[homing_override]
axes: xyz
set_position_x: 0
set_position_y: 0
set_position_z: 0
gcode:
  {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}

  # Step 1 — Z to Zmax endstops (each motor stops on its own endstop)
  {% if home_all or 'Z' in params %}
    G90
    G28 Z
  {% endif %}

  # Step 2 — X (both IDEX carriages)
  {% if home_all or 'X' in params %}
    _HOME_X
  {% endif %}

  # Step 3 — Y (dual physical endstops)
  {% if home_all or 'Y' in params %}
    _HOME_Y
  {% endif %}

  # Step 4 — CARTOGRAPHER_TOUCH to establish precise Z=0. Requires X and Y homed.
  # No brush here — PRINT_START brushes after G28, before Z tilt and the re-touch.
  # Nozzle cooldown for the touch is handled by the CARTOGRAPHER_TOUCH_HOME wrapper.
  {% if home_all or 'Z' in params %}
    {% if 'x' in printer.toolhead.homed_axes and 'y' in printer.toolhead.homed_axes %}
      _TOUCH_HOME_CENTER
    {% else %}
      { action_respond_info("Skipping CARTOGRAPHER_TOUCH — home X and Y first") }
    {% endif %}
  {% endif %}

#####################################################################
# Cartographer touch — temperature-safe wrapper
#
# Cartographer refuses to touch above UNSAFE_max_touch_temperature
# (150 °C, cartographer.cfg). This wraps the native command so every
# caller (homing, PRINT_START re-touch, console) is safe: if T0 is
# hotter than touch_temp, or heading there, the heater is set to
# touch_temp and the part fan runs until the nozzle has cooled; then the native
# touch runs and the previous heater target and fan speed are restored
# (no reheat wait — callers wait for print temp themselves).
#####################################################################

[gcode_macro CARTOGRAPHER_TOUCH_HOME]
rename_existing: _CARTOGRAPHER_TOUCH_HOME_BASE
description: Cool T0 to touch-safe temp, run Cartographer touch home, restore heater and fan
variable_touch_temp: 145               # 5 °C margin under Cartographer's 150 °C limit
gcode:
  {% set prev_target = printer.extruder.target | float %}
  {% set prev_fan    = printer['fan_generic fan_t0'].speed | float %}
  {% set needs_cool  = printer.extruder.temperature > touch_temp or prev_target > touch_temp %}
  {% if needs_cool %}
    RESPOND TYPE=echo MSG="Cooling T0 to {touch_temp}°C for Cartographer touch"
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={touch_temp}
    SET_FAN_SPEED FAN=fan_t0 SPEED=1.0
    # +2 °C: the PID approaches the target asymptotically from above, so an
    # exact MAXIMUM={touch_temp} can stall; still well under the 150 °C limit
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={touch_temp + 2}
    SET_FAN_SPEED FAN=fan_t0 SPEED={prev_fan}
  {% endif %}
  _CARTOGRAPHER_TOUCH_HOME_BASE {rawparams}
  {% if needs_cool %}
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={prev_target}   # restore previous target
  {% endif %}

[gcode_macro _TOUCH_HOME_CENTER]
description: Move T0 to a randomised bed-centre point and Cartographer touch-home Z
gcode:
  # Randomize touch point ±5 mm around bed center (X=200, Y=208)
  {% set cx = 200 %}
  {% set cy = 208 %}
  {% set rng = 5 %}
  {% set rx = range((cx - rng)|int, (cx + rng)|int + 1)|random %}
  {% set ry = range((cy - rng)|int, (cy + rng)|int + 1)|random %}
  G90
  G1 Z10 F{20 * 60}                    # clearance before XY travel
  G1 X{rx} Y{ry} F{100 * 60}           # move to randomized Cartographer probe XY
  CARTOGRAPHER_TOUCH_HOME              # wrapper — cools nozzle, sets Z=0 at contact
  G1 Z10 F{20 * 60}                    # lift to clearance
